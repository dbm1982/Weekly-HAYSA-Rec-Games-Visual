<html><head><style>

        body { 
            font-family: sans-serif; 
            background: #fff; 
            padding: 20px; 
        }
    
        .map-grid { 
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            flex-wrap: nowrap;
            align-items: flex-start;   /* <-- THIS fixes the layout */
        }

    
        .map-column {
            width: 33%;
            text-align: center;
            flex: 0 0 33%;   /* <-- THIS is the magic line */
        }

    
        .map-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1113 / 700;
            margin: 0 auto;
        }
    
        .field-map {
            width: 100%;
            height: auto;
            display: block;
        }

        .match-overlay {
            position: absolute;
            background: white;
            border: 0.5px solid black;
            text-align: center;
            padding: 0;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            transform-origin: top left;
        
            display: grid;
            grid-template-rows: 32px 32px auto;
            row-gap: 2px;
        
            overflow: hidden;
        
            min-width: 90px;   /* critical for wrapping */
        }
        
        .team-left, .team-right {
            font-weight: bold;
            color: #000;
        
            font-size: 14px;   /* JS will shrink this */
            padding: 3px;
            line-height: 1.1;
        
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        
            width: 100%;
            height: 32px;      /* fixed box height */
        
            overflow: hidden;
        
            /* Allow wrapping so shrinker can work */
            white-space: normal;
            word-break: break-word;
        }



        
        .division-label {
            font-size: 10px;
            font-weight: bold;
        
            /* Center vertically + horizontally */
            display: flex;
            align-items: center;
            justify-content: center;
        
            padding: 0 2px;
        
            white-space: nowrap;
            overflow: hidden;
            text-align: center;
        }



    
        /* PRINT MODE — large, clean, full-page */
        @media print {
    
            body {
                margin: 0;
                padding: 0;
            }
    
            .map-grid {
                flex-direction: column;   /* stack vertically for full-page print */
                gap: 40px;
            }
    
            .map-column {
                width: 100%;              /* full width on paper */
            }
    
            .map-container {
                transform: scale(1.45);   /* enlarge map for 8×11 */
                transform-origin: top left;
                margin-bottom: 40px;
            }
    
            .team-left, .team-right {
                font-weight: bold;
                color: #000;
            
                /* Auto-shrink text based on available space */
                font-size: clamp(8px, 1.2vw, 14px);
            
                padding: 3px;
                line-height: 1.1;
            
                display: block;
                max-width: 100%;
                height: 32px;
            
                /* Allow wrapping */
                white-space: normal;
            
                /* Prevent overflow */
                overflow: hidden;
            
                /* Improve wrapping behavior */
                word-break: break-word;
                overflow-wrap: break-word;
            
                text-align: center;
            }


    
            .division-label {
                font-size: 10px;
                font-weight: bold;
                padding: 2px 0;
            
                white-space: nowrap;
                overflow: hidden;
            
                display: flex;              /* center vertically */
                align-items: center;        /* center vertically */
                justify-content: center;    /* center horizontally */
            }

        }
    </style></head><body>
<h1>No upcoming Rec games found.</h1></body></html>
