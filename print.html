<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Day Print View</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 5px;
      padding: 0;
    }

    h1 {
      font-size: 18px;
      margin: 4px 0;
      text-align: center;
    }

    iframe {
      width: 100%;
      border: none;
      display: block;
    }

    /* Compact schedule section */
    .schedule {
      height: 700px;
    }

    /* Compact map section */
    .map {
      height: 900px;
    }

    hr {
      margin: 5px 0;
      border: 0;
      border-top: 1px solid #ccc;
    }

    @media print {
      body {
        margin: 0;
        zoom: 0.80;
      }

      h1 {
        margin: 2px 0;
      }

      hr {
        margin: 2px 0;
      }

      iframe {
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <h1>Game Schedule</h1>
  <iframe
    class="schedule"
    src="index.html">
  </iframe>

  <hr>

  <h1>Field Layout Map</h1>
  <iframe
    class="map"
    src="map_overlay_enhanced.html">
  </iframe>

</body>
</html>
