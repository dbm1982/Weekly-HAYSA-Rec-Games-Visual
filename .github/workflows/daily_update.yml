name: Daily Game Layout Update

on:
  schedule:
    - cron: '0 10 * * *'  # 6:00 AM EDT
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo with PAT
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests ics pytz openpyxl pypdf

    - name: Install Chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser

    - name: Run original layout generator
      run: python "Weekly Visual Rec Schedule.py"

    - name: Run enhanced layout generator
      run: python "Weekly Visual Rec Schedule Enhanced.py"

    - name: Create printable PDF
      run: |
        cat > create_pdf.py << 'EOF'
        from pathlib import Path
        from pypdf import PdfWriter
        import subprocess

        html_files = [
            "map_overlay.html",
            "map_overlay_enhanced.html"
        ]

        generated_pdfs = []

        for html in html_files:
            if Path(html).exists():
                pdf = html.replace(".html", ".pdf")

                subprocess.run([
                    "chromium-browser",
                    "--headless",
                    "--disable-gpu",
                    f"--print-to-pdf={pdf}",
                    f"file://{Path(html).resolve()}"
                ], check=True)

                generated_pdfs.append(pdf)

        if generated_pdfs:
            writer = PdfWriter()

            for pdf in generated_pdfs:
                writer.append(pdf)

            with open("Daily_Game_Layouts.pdf", "wb") as f:
                writer.write(f)
        EOF

        python create_pdf.py

    - name: List generated files (debug)
      run: ls -R .

    - name: Commit and push updated HTML
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        # Stage only the files that actually exist
        [ -f index.html ] && git add index.html
        [ -f map_overlay_enhanced.html ] && git add map_overlay_enhanced.html
        [ -f map_overlay.html ] && git add map_overlay.html
        [ -f Daily_Game_Layouts.pdf ] && git add Daily_Game_Layouts.pdf

        git diff --cached --quiet || git commit -m "🔄 Daily update: original + enhanced overlays"

        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
        git push origin main

    - name: Show Git identity
      run: git config --list
