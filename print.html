<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Day Print View</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 5px;
      padding: 0;
    }

    h1 {
      font-size: 18px;
      margin: 6px 0;
      text-align: center;
    }

    iframe {
      width: 100%;
      border: none;
      display: block;
      overflow: hidden;
    }

    .schedule,
    .map {
      width: 100%;
    }

    hr {
      margin: 8px 0;
      border: 0;
      border-top: 1px solid #ccc;
    }

    @media print {
      body {
        margin: 0;
      }

      h1 {
        margin: 4px 0;
      }

      hr {
        margin: 4px 0;
      }

      iframe {
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <h1>Game Schedule</h1>

  <iframe
    id="scheduleFrame"
    class="schedule"
    src="index.html">
  </iframe>

  <hr>

  <h1>Field Layout Map</h1>

  <iframe
    id="mapFrame"
    class="map"
    src="map_overlay_enhanced.html">
  </iframe>

  <script>
    function resizeIframe(iframe) {
      try {
        const body =
          iframe.contentWindow.document.body;

        const html =
          iframe.contentWindow.document.documentElement;

        const height = Math.max(
          body.scrollHeight,
          body.offsetHeight,
          html.clientHeight,
          html.scrollHeight,
          html.offsetHeight
        );

        iframe.style.height = height + 'px';
      } catch (e) {
        console.log(e);
      }
    }

    window.addEventListener('load', () => {
      document
        .querySelectorAll('iframe')
        .forEach(frame => {
          frame.addEventListener('load', () => {
            resizeIframe(frame);

            setTimeout(() => {
              resizeIframe(frame);
            }, 500);
          });
        });
    });
  </script>

</body>
</html>
