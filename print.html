<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Game Day Print View</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 5px;
      padding: 0;
    }

    h1 {
      text-align: center;
      margin: 8px 0;
      font-size: 18px;
    }

    hr {
      margin: 10px 0;
      border: none;
      border-top: 1px solid #ccc;
    }

    .section {
      width: 100%;
    }

    @media print {
      body {
        margin: 0;
        zoom: 0.85;
      }

      h1 {
        margin: 4px 0;
      }

      hr {
        margin: 6px 0;
      }
    }
  </style>
</head>

<body>

  <div id="schedule-section" class="section">
    <h1>Game Schedule</h1>
  </div>

  <hr>

  <div id="map-section" class="section">
    <h1>Field Layout Map</h1>
  </div>

  <script>
    async function loadContent() {

      const scheduleHtml = await fetch('index.html')
        .then(r => r.text());

      const mapHtml = await fetch('map_overlay_enhanced.html')
        .then(r => r.text());

      const scheduleBody =
        scheduleHtml.match(/<body[^>]*>([\s\S]*?)<\/body>/i)?.[1]
        || scheduleHtml;

      const mapBody =
        mapHtml.match(/<body[^>]*>([\s\S]*?)<\/body>/i)?.[1]
        || mapHtml;

      document.getElementById('schedule-section')
        .insertAdjacentHTML('beforeend', scheduleBody);

      document.getElementById('map-section')
        .insertAdjacentHTML('beforeend', mapBody);
    }

    loadContent();
  </script>

</body>
</html>
