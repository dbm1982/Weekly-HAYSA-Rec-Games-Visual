<html><head><style>

        body { 
            font-family: sans-serif; 
            background: #fff; 
            padding: 20px; 
        }
    
        .map-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(
                var(--column-count),
                minmax(0, 1fr)
            );
        }
        
        .map-column {
            width: 100%;
            text-align: center;
        }

    
        .map-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1113 / 1590;
            margin: 0 auto;
        }
    
        .field-map {
            width: 100%;
            height: auto;
            display: block;
        }

        .match-overlay {
            position: absolute;
            background: white;
            border: 0.5px solid black;
            text-align: center;
            padding: 0;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            transform-origin: top left;
        
            display: grid;
            grid-template-rows: 32px 32px auto;
            row-gap: 2px;
        
            overflow: hidden;
        
            min-width: 90px;   /* critical for wrapping */
        }
        
        .team-left, .team-right {
            font-weight: bold;
            color: #000;
        
            font-size: 14px;   /* JS will shrink this */
            padding: 3px;
            line-height: 1.1;
        
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        
            width: 100%;
            height: 32px;      /* fixed box height */
        
            overflow: hidden;
        
            /* Allow wrapping so shrinker can work */
            white-space: normal;
            word-break: break-word;
        }



        
        .division-label {
            font-size: 10px;
            font-weight: bold;
        
            /* Center vertically + horizontally */
            display: flex;
            align-items: center;
            justify-content: center;
        
            padding: 0 2px;
        
            white-space: nowrap;
            overflow: hidden;
            text-align: center;
        }



    
        /* PRINT MODE — large, clean, full-page */
        @media print {
    
            body {
                margin: 0;
                padding: 0;
            }
    
            .map-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
    
            .map-column {
                width: 100%;              /* full width on paper */
            }
    
            .map-container {
                transform: scale(1.45);   /* enlarge map for 8×11 */
                transform-origin: top left;
                margin-bottom: 40px;
            }
    
            .team-left, .team-right {
                font-weight: bold;
                color: #000;
            
                /* Auto-shrink text based on available space */
                font-size: clamp(8px, 1.2vw, 14px);
            
                padding: 3px;
                line-height: 1.1;
            
                display: block;
                max-width: 100%;
                height: 32px;
            
                /* Allow wrapping */
                white-space: normal;
            
                /* Prevent overflow */
                overflow: hidden;
            
                /* Improve wrapping behavior */
                word-break: break-word;
                overflow-wrap: break-word;
            
                text-align: center;
            }


    
            .division-label {
                font-size: 10px;
                font-weight: bold;
                padding: 2px 0;
            
                white-space: nowrap;
                overflow: hidden;
            
                display: flex;              /* center vertically */
                align-items: center;        /* center vertically */
                justify-content: center;    /* center horizontally */
            }

        }
    </style></head><body>
<h1>Game Day: Sunday, November 08</h1>
<div class='map-grid' style='--column-count:5;'>
<div class='map-column'><h2>3:00 PM</h2>
<div class='map-container'><img src='assets/field_map.jpeg' class='field-map'>
</div></div>
<div class='map-column'><h2>3:45 PM</h2>
<div class='map-container'><img src='assets/field_map.jpeg' class='field-map'>
</div></div>
<div class='map-column'><h2>4:30 PM</h2>
<div class='map-container'><img src='assets/field_map.jpeg' class='field-map'>
</div></div>
<div class='map-column'><h2>5:30 PM</h2>
<div class='map-container'><img src='assets/field_map.jpeg' class='field-map'>
</div></div>
<div class='map-column'><h2>6:30 PM</h2>
<div class='map-container'><img src='assets/field_map.jpeg' class='field-map'>
</div></div>
</div>

<script>
function shrinkToFit(el) {
    let max = 14;
    let min = 6;
    let size = max;

    el.style.fontSize = size + "px";

    while (size > min && el.scrollHeight > el.clientHeight) {
        size -= 1;
        el.style.fontSize = size + "px";
    }
}

document.querySelectorAll('.team-left, .team-right').forEach(el => {
    shrinkToFit(el);
});
</script>
</body></html>
