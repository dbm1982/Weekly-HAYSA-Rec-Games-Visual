name: Daily Game Layout Update

on:
  schedule:
    - cron: '0 10 * * *'  # 6:00 AM EDT
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo with PAT
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests ics pytz openpyxl

    - name: Run original layout generator
      run: python "Weekly Visual Rec Schedule.py"

    - name: Run enhanced layout generator
      run: python "Weekly Visual Rec Schedule Enhanced.py"

    - name: Create combined print view
      run: |
        cat > print.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>Game Day Print View</title>

          <style>
            body {
              font-family: Arial, sans-serif;
              margin: 5px;
              padding: 0;
            }

            h1 {
              font-size: 18px;
              margin: 6px 0;
              text-align: center;
            }

            iframe {
              width: 100%;
              border: none;
              display: block;
              overflow: hidden;
            }

            .schedule,
            .map {
              width: 100%;
            }

            hr {
              margin: 8px 0;
              border: 0;
              border-top: 1px solid #ccc;
            }

            @media print {
              body {
                margin: 0;
              }

              h1 {
                margin: 4px 0;
              }

              hr {
                margin: 4px 0;
              }

              iframe {
                page-break-inside: avoid;
              }
            }
          </style>
        </head>

        <body>

          <h1>Game Schedule</h1>

          <iframe
            id="scheduleFrame"
            class="schedule"
            src="index.html">
          </iframe>

          <hr>

          <h1>Field Layout Map</h1>

          <iframe
            id="mapFrame"
            class="map"
            src="map_overlay_enhanced.html">
          </iframe>

          <script>
            function resizeIframe(iframe) {
              try {
                const body =
                  iframe.contentWindow.document.body;

                const html =
                  iframe.contentWindow.document.documentElement;

                const height = Math.max(
                  body.scrollHeight,
                  body.offsetHeight,
                  html.clientHeight,
                  html.scrollHeight,
                  html.offsetHeight
                );

                iframe.style.height = height + 'px';
              } catch (e) {
                console.log(e);
              }
            }

            window.addEventListener('load', () => {
              document
                .querySelectorAll('iframe')
                .forEach(frame => {
                  frame.addEventListener('load', () => {
                    resizeIframe(frame);

                    setTimeout(() => {
                      resizeIframe(frame);
                    }, 500);
                  });
                });
            });
          </script>

        </body>
        </html>
        EOF

    - name: List generated files (debug)
      run: ls -R .

    - name: Commit and push updated HTML
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        # Stage only the files that actually exist
        [ -f index.html ] && git add index.html
        [ -f map_overlay_enhanced.html ] && git add map_overlay_enhanced.html
        [ -f map_overlay.html ] && git add map_overlay.html
        [ -f print.html ] && git add print.html

        git diff --cached --quiet || git commit -m "🔄 Daily update: original + enhanced overlays"

        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
        git push origin main

    - name: Show Git identity
      run: git config --list
